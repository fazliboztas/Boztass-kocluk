<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boztaş Koçluk & Öğrenci Takip Portalı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    body { background-color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="p-4 md:p-8">

  <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-6">
    <header class="border-b pb-4 mb-6 text-center">
      <h1 class="text-3xl font-bold text-indigo-600">BOZTAŞ KOÇLUK PORTALI</h1>
      <p class="text-gray-500 text-sm mt-1">Canlı Öğrenci & Ödev Takip Sistemi</p>
    </header>

    <!-- GİRİŞ EKRANI -->
    <div id="login-screen" class="max-w-md mx-auto bg-gray-50 p-6 rounded-lg border">
      <h2 class="text-xl font-bold mb-4 text-gray-800 text-center">Sisteme Giriş Yap</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Kullanıcı Adı</label>
          <input type="text" id="username" class="w-full border rounded p-2 mt-1" placeholder="Örn: koc veya ahmet">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Şifre</label>
          <input type="password" id="password" class="w-full border rounded p-2 mt-1" placeholder="***">
        </div>
        <button onclick="login()" class="w-full bg-indigo-600 text-white font-bold py-2 rounded hover:bg-indigo-700 transition">Giriş Yap</button>
        <p id="login-error" class="text-red-500 text-xs text-center hidden">Hatalı kullanıcı adı veya şifre!</p>
      </div>
    </div>

    <!-- PANEL EKRANI (Giriş Yapılınca Açılır) -->
    <div id="dashboard-screen" class="hidden">
      <div class="flex justify-between items-center mb-6 bg-indigo-50 p-4 rounded-lg">
        <div>
          <span class="text-sm text-gray-500">Hoş Geldin,</span>
          <h2 id="user-display-name" class="text-xl font-bold text-indigo-900"></h2>
        </div>
        <button onclick="logout()" class="bg-red-500 text-white text-sm px-3 py-1.5 rounded hover:bg-red-600">Çıkış Yap</button>
      </div>

      <!-- KOÇ ÖDEV EKLEME FORMU (Sadece Koç Görür) -->
      <div id="koc-controls" class="hidden bg-gray-50 p-4 rounded-lg border mb-6">
        <h3 class="font-bold text-gray-700 mb-3">Yeni Ödev / Görev Tanimla</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <input type="text" id="task-title" placeholder="Görev Başlığı (Örn: Matematik)" class="border p-2 rounded col-span-2">
          <button onclick="addAssignment()" class="bg-green-600 text-white font-bold p-2 rounded hover:bg-green-700">+ Görev Ekle</button>
        </div>
      </div>

      <!-- ÖDEV LİSTESİ -->
      <div>
        <h3 class="font-bold text-gray-800 text-lg mb-3">📋 Aktif Ödevler ve Görevler</h3>
        <div id="assignment-list" class="space-y-3">
          <p class="text-gray-400 text-sm">Yükleniyor...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 1. FIREBASE CONFIĞURASYONU
    const firebaseConfig = {
      apiKey: "AIzaSyCZFybGhwHvtzagIzcTiDnkkNgQO25asOg",
      authDomain: "boztas-kocluk.firebaseapp.com",
      databaseURL: "https://boztas-kocluk-default-rtdb.firebaseio.com",
      projectId: "boztas-kocluk",
      storageBucket: "boztas-kocluk.firebasestorage.app",
      messagingSenderId: "1082374846509",
      appId: "1:1082374846509:web:d21a981dd346da110c60a4"
    };

    // Firebase Başlat
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = null;

    // 2. GİRİŞ KONTROLÜ
    function login() {
      const user = document.getElementById('username').value.trim().toLowerCase();
      const pass = document.getElementById('password').value.trim();

      // Basit Şifre Mantığı (İsteğe göre genişletilebilir)
      if ((user === 'koc' && pass === '123') || (user === 'ogrenci' && pass === '123')) {
        currentUser = user;
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('dashboard-screen').classList.remove('hidden');
        document.getElementById('user-display-name').innerText = user === 'koc' ? 'Koç (Öğretmen Panel)' : 'Öğrenci Paneli';
        
        if (user === 'koc') {
          document.getElementById('koc-controls').classList.remove('hidden');
        }

        listenAssignments();
      } else {
        document.getElementById('login-error').classList.remove('hidden');
      }
    }

    function logout() {
      location.reload();
    }

    // 3. CANLI ÖDEV EKLEME (KOÇ)
    function addAssignment() {
      const title = document.getElementById('task-title').value.trim();
      if (!title) return alert('Lütfen görev başlığı girin!');

      const newRef = db.ref('assignments').push();
      newRef.set({
        title: title,
        completed: false,
        createdAt: new Date().toLocaleDateString('tr-TR')
      });

      document.getElementById('task-title').value = '';
    }

    // 4. CANLI ÖDEV LİSTELEME & DİNLEME (VERİTABANINDAN CANLI ÇEKER)
    function listenAssignments() {
      db.ref('assignments').on('value', (snapshot) => {
        const listDiv = document.getElementById('assignment-list');
        listDiv.innerHTML = '';

        const data = snapshot.val();
        if (!data) {
          listDiv.innerHTML = '<p class="text-gray-400 text-sm">Henüz eklenmiş bir ödev yok.</p>';
          return;
        }

        Object.keys(data).forEach(id => {
          const item = data[id];
          const itemDiv = document.createElement('div');
          itemDiv.className = `flex justify-between items-center p-3 rounded border ${item.completed ? 'bg-green-50 border-green-200' : 'bg-white border-gray-200'}`;
          
          itemDiv.innerHTML = `
            <div>
              <p class="font-medium ${item.completed ? 'line-through text-gray-500' : 'text-gray-800'}">${item.title}</p>
              <span class="text-xs text-gray-400">${item.createdAt}</span>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="toggleStatus('${id}', ${item.completed})" class="text-sm px-3 py-1 rounded ${item.completed ? 'bg-gray-200 text-gray-700' : 'bg-green-600 text-white'}">
                ${item.completed ? 'Tamamlandı Yap' : 'Tamamla ✓'}
              </button>
              ${currentUser === 'koc' ? `<button onclick="deleteAssignment('${id}')" class="text-red-500 hover:text-red-700 text-sm font-bold px-2">X</button>` : ''}
            </div>
          `;
          listDiv.appendChild(itemDiv);
        });
      });
    }

    // 5. DURUM GÜNCELLEME (TAMAMLANTI / TAMAMLANMADI)
    function toggleStatus(id, currentStatus) {
      db.ref('assignments/' + id).update({
        completed: !currentStatus
      });
    }

    // 6. ÖDEV SİLME (SADECE KOÇ)
    function deleteAssignment(id) {
      if (confirm('Bu ödevi silmek istediğinize emin misiniz?')) {
        db.ref('assignments/' + id).remove();
      }
    }
  </script>
</body>
</html>
